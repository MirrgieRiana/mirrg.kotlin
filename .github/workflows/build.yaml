name: ビルド

on:
  push:
    branches:
      - lithium
  pull_request:
    branches:
      - lithium

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ビルド
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: build

      - name: Javaのセットアップ
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: ビルド
        working-directory: build
        run: |
          ./gradlew --no-daemon build publish
